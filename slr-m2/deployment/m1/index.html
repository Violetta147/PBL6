<!doctype html><html lang="en"><meta charset="utf-8"><title>M1 replay inspector</title>
<style>body{font:16px system-ui;background:#111827;color:#e5e7eb;margin:32px}button,input,select{font:inherit;padding:8px;margin:4px}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}video{width:100%;max-height:62vh}pre{overflow:auto;max-height:420px;background:#1f2937;padding:16px}canvas{width:100%;height:180px;background:#fff}label{display:block}</style>
<h1>07b replay inspector</h1><label>Open video <input id="open-video" type="file" accept="video/*,.mkv"></label><p id="open-status" role="status"></p><p id="status"></p><main><section><video id="video" controls></video><button id="back">Previous frame</button><button id="next">Next frame</button><p id="state"></p><canvas id="pose" width="640" height="360"></canvas><label>Manual start <input id="start" type="number" step="any"></label><button id="markStart">Mark start</button><label>Manual end <input id="end" type="number" step="any"></label><button id="markEnd">Mark end</button><button id="save">Classify manual cut</button></section><section><h2>Boundary timeline</h2><p id="boundary-summary"></p><div id="timeline"></div><h2>Automatic segment</h2><select id="segments"></select><h2>Manual revision</h2><select id="manual"></select><p>Scores are uncalibrated. Channels contain global bone XY, local bone XY, usable, observed, imputed and local-valid flags. Root coordinates follow the frozen adapter.</p><label>Model position <input id="position" type="range" min="0" max="149" value="0"></label><pre id="automatic"></pre><pre id="comparison"></pre></section></main>
<script>
let data, autoTensor, manualTensor, generation=0; const $=id=>document.getElementById(id), video=$('video');
const runId = new URLSearchParams(location.search).get('run_id');
function replayUrl(path) {
  const url = new URL(path, location.origin);
  if (runId) url.searchParams.set('run_id', runId);
  return url;
}
video.src = replayUrl('/video');
$('open-video').onchange = async () => {
  const picker = $('open-video');
  const file = picker.files[0];
  if (!file) return;
  picker.disabled = true;
  video.pause();
  $('open-status').textContent = 'Processing ' + file.name + '…';
  const url = replayUrl('/open-video');
  url.searchParams.set('filename', file.name);
  try {
    const result = await api(url, {method: 'POST', body: file});
    location.search = new URLSearchParams({run_id: result.run_id});
  } catch (error) {
    $('open-status').textContent = error.status === 404
      ? 'This server does not recognize the upload or replay. Restart the M1 server, open the home page at http://127.0.0.1:8765/, then try again.'
      : error.message;
    picker.value = '';
    picker.disabled = false;
  }
};
async function api(url,options){const r=await fetch(replayUrl(url),options);if(!r.ok)throw Object.assign(new Error(await r.text()), {status: r.status});return r.json()}
function show(){const i=+$('position').value;for(const [tensor,id] of [[autoTensor,'automatic'],[manualTensor,'comparison']])if(tensor){const local=tensor.frame_indices[i];$(id).textContent=JSON.stringify({prediction:tensor.prediction,position:i,source_frame:tensor.source_frames[local],real:tensor.real[i],time:tensor.time[i],features:tensor.x[i]},null,2)}}
const requestIds = {};
async function select(id, kind, seek = false) {
  const request = requestIds[kind] = (requestIds[kind] || 0) + 1;
  const items = kind === 'auto' ? data.events : data.annotations;
  const segment = items.find(item => item.segment_id === $(id).value);
  const panel = $(kind === 'auto' ? 'automatic' : 'comparison');
  if (kind === 'auto') autoTensor = null; else manualTensor = null;
  if (!segment) {
    panel.textContent = kind === 'auto' ? 'No automatic segment to inspect.' : 'No manual cut saved.';
    return;
  }
  if (seek) {
    video.pause();
    video.currentTime = segment.movement_start ?? segment.start;
  }
  panel.textContent = segment.reason ? 'Incomplete: ' + segment.reason : 'No classifier output for this segment.';
  if (!segment.artifact) return;
  try {
    const tensor = await api('/tensor/' + encodeURIComponent(segment.segment_id));
    if (request !== requestIds[kind]) return;
    if (kind === 'auto') autoTensor = tensor; else manualTensor = tensor;
    show();
  } catch (e) {
    if (request === requestIds[kind]) panel.textContent = e.message;
  }
}

function renderTimeline(segments) {
  const complete = segments.filter(segment => segment.status === 'complete').length;
  const tracked = data.frames.some(frame => frame.state === 'READY');
  $('boundary-summary').textContent = segments.length
    ? `${complete} complete · ${segments.length - complete} incomplete. Click a boundary to seek.`
    : tracked ? 'No automatic boundaries detected in this clip.'
      : `No automatic boundaries. The detector never confirmed ${data.run.config.rest.toFixed(2)} s of arms-down rest.`;
  const timeline = $('timeline');
  timeline.replaceChildren();
  for (const segment of segments) {
    const row = document.createElement('div');
    for (const [label, time] of [['Start', segment.movement_start], ['End', segment.movement_end]]) {
      const marker = document.createElement('button');
      marker.textContent = `Segment ${segment.segment_id} · ${label} ${time.toFixed(2)} s`;
      marker.onclick = () => { video.pause(); video.currentTime = time; };
      row.append(marker);
    }
    if (segment.reason) row.append(`Incomplete (${segment.reason})`);
    timeline.append(row);
  }
}

async function load() {
  data = await api('/data');
  $('status').textContent = 'Replay ' + data.run.status;
  const segments = data.events.filter(event => event.segment_id);
  renderTimeline(segments);
  for (const [id, kind, items] of [['segments', 'auto', segments], ['manual', 'manual', data.annotations]]) {
    const menu = $(id);
    menu.replaceChildren();
    for (const segment of items) {
      const option = document.createElement('option');
      option.value = segment.segment_id;
      option.textContent = `${segment.segment_id} (${segment.start.toFixed(2)}–${segment.end.toFixed(2)} s)`;
      menu.append(option);
    }
    if (!items.length) menu.append(new Option(id === 'segments' ? 'No detected segments' : 'No saved cuts'));
    menu.disabled = !items.length;
    await select(id, kind);
  }
}
$('segments').onchange = () => select('segments', 'auto', true);
$('manual').onchange = () => select('manual', 'manual', true);
$('position').oninput = show;
function frameIndex(){return Math.max(0,data.frames.findLastIndex(f=>f.timestamp<=video.currentTime))}
for(const [id,delta] of [['back',-1],['next',1]])$(id).onclick=()=>{video.pause();video.currentTime=data.frames[Math.max(0,Math.min(data.frames.length-1,frameIndex()+delta))].timestamp};
video.ontimeupdate=()=>{if(!data)return;const f=data.frames[frameIndex()];$('state').textContent=`Frame ${f.frame_id} · ${f.state} · ${f.arms.join(' / ')}`;const c=$('pose').getContext('2d');c.clearRect(0,0,640,360);c.strokeStyle='#2563eb';for(const [a,b] of [[0,1],[0,2],[2,4],[1,3],[3,5],[0,6],[1,7],[6,7]]){if(f.pose[a][0]===null||f.pose[b][0]===null)continue;c.beginPath();c.moveTo(f.pose[a][0]*640,f.pose[a][1]*360);c.lineTo(f.pose[b][0]*640,f.pose[b][1]*360);c.stroke()}};
$('markStart').onclick = () => {
  if (!data) return;
  $('start').value = data.frames[frameIndex()].timestamp;
};
$('markEnd').onclick = () => {
  if (!data) return;
  $('end').value = data.frames[frameIndex()].timestamp;
};
$('save').onclick=async()=>{$('save').disabled=true;try{await api('/cuts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({start:+$('start').value,end:+$('end').value})});await load()}catch(e){$('status').textContent=e.message}finally{$('save').disabled=false}};load().catch(e=>$('status').textContent=e.message);
</script></html>
