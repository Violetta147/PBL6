<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>STT · Tiếng Việt</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: #F5F7F9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #18212B;
      user-select: none;
      -webkit-user-select: none;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #BAC5D0;
      border-top-color: #273D53;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 8px 0;
      letter-spacing: -0.01em;
      color: #18212B;
    }
    p {
      font-size: 14px;
      color: #4F5D6B;
      margin: 0;
      font-weight: 400;
    }
    .error-container {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 16px;
    }
    .error-text {
      color: #C53030;
      font-size: 13px;
      margin-bottom: 12px;
      max-width: 320px;
    }
    .retry-btn {
      background: #273D53;
      color: #FFFFFF;
      border: none;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
    }
    .retry-btn:hover {
      background: #1B2B3A;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="spinner" class="spinner"></div>
    <h2>STT · Tiếng Việt</h2>
    <p id="status-text">Đang khởi động hệ thống...</p>
    <div id="error-box" class="error-container">
      <p id="error-message" class="error-text"></p>
      <button class="retry-btn" type="button" onclick="retryStartup()">Thử lại</button>
    </div>
  </div>
  <script>
    function retryStartup() {
      const spinner = document.getElementById('spinner');
      if (spinner) spinner.style.display = 'block';
      const status = document.getElementById('status-text');
      if (status) status.innerText = 'Đang khởi động hệ thống...';
      const errBox = document.getElementById('error-box');
      if (errBox) errBox.style.display = 'none';

      if (window.electronAPI && typeof window.electronAPI.retryStartup === 'function') {
        window.electronAPI.retryStartup();
      } else {
        window.location.reload();
      }
    }
  </script>
</body>
</html>
